          type: string
        permissions:
          description: The permissions of the role as a bitmask
          type: number
      required:
        - key
        - name
        - permissions
      type: object
    UserEntity:
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountEntity"
          type: array
        createdAt:
          description: The date the user was created
          example: 2025-10-05T14:48:00.000Z
          format: date-time
          type: string
        email:
          description: The email of the user
          format: email
          type: string
        emailVerified:
          description: The date the user email was verified
          example: 2025-11-27T11:22:59.096Z
          format: date-time
          nullable: true
          type: string
        id:
          description: The unique identifier of the user
          format: uuid
          type: string
        image:
          description: The image of the user
          format: uri
          nullable: true
          type: string
        invites:
          items:
            $ref: "#/components/schemas/InviteEntity"
          type: array
        members:
          items:
            $ref: "#/components/schemas/MemberEntity"
          type: array
        name:
          description: The name of the user
          type: string
        role:
          $ref: "#/components/schemas/RoleEntity"
        roleId:
          description: The unique identifier of the role
          format: uuid
          type: string
        updatedAt:
          description: The date the user was updated
          example: 2025-10-05T14:48:00.000Z
          format: date-time
          type: string
        verificationTokens:
          items:
            $ref: "#/components/schemas/VerificationTokenEntity"
          type: array
      required:
        - id
        - name
        - email
        - emailVerified
        - image
        - roleId
        - createdAt
        - updatedAt
      type: object
    VerificationTokenEntity:
      properties:
        createdAt:
          format: date-time
          type: string
        expires:
          format: date-time
          type: string
        token:
          format: uuid
          type: string
        type:
          enum:
            - ACTIVE_ACCOUNT
            - RESET_PASSWORD
          type: string
        updatedAt:
          format: date-time
          type: string
        user:
          $ref: "#/components/schemas/UserEntity"
        userId:
          format: uuid
          type: string
      required:
        - token
        - type
        - expires
        - userId
        - createdAt
        - updatedAt
      type: object
  securitySchemes:
    access-token:
      bearerFormat: JWT
      description: Enter JWT token
      scheme: bearer
      type: http
