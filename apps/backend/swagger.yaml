info:
  title: Snipet
  description: The Snipet API description
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Enter JWT token
  schemas:
    FileURLResponseDto:
      type: object
      properties:
        url:
          type: string
          example: https://example.com/file.pdf
        key:
          type: string
          example: path/to/my-file.pdf
      required:
        - url
        - key
    GetUploadUrlDto:
      type: object
      properties:
        fileName:
          type: string
          example: my-file.pdf
        contentType:
          type: string
          example: application/pdf
        fileSize:
          type: number
          example: 104857600
          description: "File size in bytes (max: 100.00 MB"
      required:
        - fileName
        - contentType
        - fileSize
    SourceDocMetadata:
      type: object
      properties:
        extension:
          type: string
        contentType:
          type: string
        size:
          type: number
        lastModified:
          type: number
        exif:
          type: object
        type:
          type: string
          enum:
            - TEXT
            - DOC
            - LINK
            - VIDEO
            - AUDIO
            - IMAGE
      required:
        - extension
        - contentType
        - size
        - type
    SourceImageMetadata:
      type: object
      properties:
        extension:
          type: string
        contentType:
          type: string
        size:
          type: number
        lastModified:
          type: number
        exif:
          type: object
        type:
          type: string
          enum:
            - TEXT
            - DOC
            - LINK
            - VIDEO
            - AUDIO
            - IMAGE
        width:
          type: number
        height:
          type: number
      required:
        - extension
        - contentType
        - size
        - type
    SourceVideoMetadata:
      type: object
      properties:
        extension:
          type: string
        contentType:
          type: string
        size:
          type: number
        lastModified:
          type: number
        exif:
          type: object
        type:
          type: string
          enum:
            - TEXT
            - DOC
            - LINK
            - VIDEO
            - AUDIO
            - IMAGE
        width:
          type: number
        height:
          type: number
        duration:
          type: number
      required:
        - extension
        - contentType
        - size
        - type
    SourceAudioMetadata:
      type: object
      properties:
        extension:
          type: string
        contentType:
          type: string
        size:
          type: number
        lastModified:
          type: number
        exif:
          type: object
        type:
          type: string
          enum:
            - TEXT
            - DOC
            - LINK
            - VIDEO
            - AUDIO
            - IMAGE
        duration:
          type: number
      required:
        - extension
        - contentType
        - size
        - type
    InviteEntity:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the invite
          format: uuid
        tenantId:
          type: string
          description: The ID of the tenant this invite belongs to
          format: uuid
        email:
          type: string
          description: The email address of the person being invited
          format: email
        roleId:
          type: string
          description: The ID of the role assigned to the invited person
          format: uuid
        userId:
          type: string
          description: The ID of the user being invited, if they already exist
          format: uuid
        creatorId:
          type: string
          description: The ID of the user who created the invite
          format: uuid
        expiresAt:
          format: date-time
          type: string
          description: The timestamp when the invite expires
        createdAt:
          format: date-time
          type: string
          description: The timestamp when the invite was created
        updatedAt:
          format: date-time
          type: string
          description: The timestamp when the invite was last updated
        tenant:
          $ref: "#/components/schemas/TenantEntity"
        role:
          $ref: "#/components/schemas/RoleEntity"
        user:
          $ref: "#/components/schemas/UserEntity"
        creator:
          $ref: "#/components/schemas/MemberEntity"
      required:
        - id
        - tenantId
        - email
        - roleId
        - creatorId
        - expiresAt
        - createdAt
        - updatedAt
    RoleEntity:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the role
          format: uuid
        key:
          type: string
          description: The key of the role
        name:
          type: string
          description: The name of the role
        permissions:
          type: number
          description: The permissions of the role as a bitmask
        scope:
          type: string
          description: The scope of the role
          enum:
            - TENANT
            - GLOBAL
        tenantId:
          type: string
          description: The ID of the tenant this role belongs to
          nullable: true
          format: uuid
        createdById:
          type: string
          description: The ID of the user who created the role
          nullable: true
          format: uuid
        createdAt:
          format: date-time
          type: string
          description: The timestamp when the role was created
        updatedAt:
          format: date-time
          type: string
          description: The timestamp when the role was last updated
        tenant:
          $ref: "#/components/schemas/TenantEntity"
        createdBy:
          $ref: "#/components/schemas/MemberEntity"
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserEntity"
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberEntity"
        invites:
          type: array
          items:
            $ref: "#/components/schemas/InviteEntity"
      required:
        - id
        - key
        - name
        - permissions
        - scope
        - tenantId
        - createdById
        - createdAt
        - updatedAt
    AccountEntity:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the account
          format: uuid
        provider:
          type: string
          description: The provider of the account
          example: google
        providerAccountId:
          type: string
          description: The provider account id of the account
          example: "11786321736412"
        userId:
          type: string
          description: The unique identifier of the user
          format: uuid
        user:
          $ref: "#/components/schemas/UserEntity"
        createdAt:
          format: date-time
          type: string
          description: The date the account was created
          example: 2025-11-25T19:12:10.032Z
        updatedAt:
          format: date-time
          type: string
          description: The date the account was updated
          example: 2025-11-25T19:12:10.032Z
      required:
        - id
        - provider
        - providerAccountId
        - userId
        - createdAt
        - updatedAt
    VerificationTokenEntity:
      type: object
      properties:
        token:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - ACTIVE_ACCOUNT
            - RESET_PASSWORD
        expires:
          format: date-time
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          format: date-time
