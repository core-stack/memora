components:
  schemas:
    AccountEntity:
      properties:
        createdAt:
          description: The date the account was created
          example: 2025-10-05T14:48:00.000Z
          format: date-time
          type: string
        id:
          description: The unique identifier of the account
          format: uuid
          type: string
        provider:
          description: The provider of the account
          example: google
          type: string
        providerAccountId:
          description: The provider account id of the account
          example: "11786321736412"
          type: string
        updatedAt:
          description: The date the account was updated
          example: 2025-10-05T14:48:00.000Z
          format: date-time
          type: string
        user:
          $ref: "#/components/schemas/UserEntity"
        userId:
          description: The unique identifier of the user
          format: uuid
          type: string
      required:
        - id
        - provider
        - providerAccountId
        - userId
        - createdAt
        - updatedAt
      type: object
    ActiveAccountDto:
      properties:
        token:
          type: string
      required:
        - token
      type: object
    ChatEntity:
      properties:
        createdAt:
          description: The timestamp when the chat was created
          format: date-time
          type: string
        id:
          description: The unique identifier of the chat
          format: uuid
          type: string
        knowledge:
          $ref: "#/components/schemas/KnowledgeEntity"
        knowledgeId:
          description: The ID of the associated knowledge base
          format: uuid
          type: string
        messages:
          items:
            $ref: "#/components/schemas/MessageEntity"
          type: array
        name:
          description: The name of the chat
          type: string
        tenantId:
          description: The ID of the tenant this chat belongs to
          format: uuid
          type: string
        updatedAt:
          description: The timestamp when the chat was last updated
          format: date-time
          type: string
      required:
        - id
        - name
        - knowledgeId
        - tenantId
        - createdAt
        - updatedAt
      type: object
    CreateAccountDto:
      properties:
        email:
          type: string
        name:
          type: string
        password:
          maxLength: 100
          minLength: 6
          type: string
      required:
        - name
        - email
        - password
      type: object
    CreateChatDto:
      properties:
        name:
          description: The name of the chat
          type: string
      required:
        - name
      type: object
    CreateFolderDto:
      properties:
        name:
          description: The name of the folder
          type: string
        parentId:
          description: The ID of the parent folder
          format: uuid
          nullable: true
          type: string
      required:
        - name
      type: object
    CreateKnowledgeDto:
      properties:
        description:
          description: A brief description of the knowledge base
          nullable: true
          type: string
        slug:
          description: The URL-friendly slug for the knowledge base
          type: string
        title:
          description: The title of the knowledge base
          type: string
      required:
        - slug
        - title
      type: object
    CreateLLMDto:
      properties:
        config:
          description: The configuration for the LLM
          type: object
        model:
          description: The model identifier
          type: string
        name:
          description: The name of the LLM
          type: string
        type:
          description: The type of the LLM
          enum:
            - EMBEDDING
            - TEXT
          type: string
      required:
        - name
        - model
        - config
        - type
      type: object
    CreateMessageDto:
      properties:
        content:
          description: The content of the message
          type: string
      required:
        - content
      type: object
    CreateMessageResponseDto:
      properties:
        aiMessage:
          $ref: "#/components/schemas/MessageEntity"
        userMessage:
          $ref: "#/components/schemas/MessageEntity"
      required:
        - userMessage
        - aiMessage
      type: object
    CreateRoleDto:
      properties:
        key:
          description: The key of the role
          type: string
        name:
          description: The name of the role
          type: string
        permissions:
          description: The permissions of the role as a bitmask
          type: number
      required:
        - key
        - name
        - permissions
      type: object
    CreateSourceDto:
      properties:
        folderId:
          description: The ID of the folder this source belongs to
          format: uuid
          type: string
        key:
          description: The key of the source file in the storage
          type: string
        metadata:
          description: The metadata of the source
          oneOf:
            - $ref: "#/components/schemas/SourceDocMetadata"
            - $ref: "#/components/schemas/SourceImageMetadata"
            - $ref: "#/components/schemas/SourceVideoMetadata"
            - $ref: "#/components/schemas/SourceAudioMetadata"
        name:
          description: The name of the source
          type: string
        originalName:
          description: The original name of the file
          type: string
        sourceType:
          description: The type of the source
          enum:
            - TEXT
            - DOC
            - LINK
            - VIDEO
            - AUDIO
            - IMAGE
          type: string
      required:
        - key
        - name
        - metadata
        - sourceType
      type: object
    CreateTenantDto:
      properties:
        backgroundImage:
          description: The URL of the background image for the tenant
          nullable: true
          type: string
        description:
          description: A brief description of the tenant
          nullable: true
          type: string
        name:
          description: The name of the tenant
          type: string
      required:
        - name
        - backgroundImage
      type: object
    ErrorResponse:
      properties:
        code:
          type: string
        error:
          type: string
        timestamp:
          format: date-time
          type: string
      required:
        - error
        - code
        - timestamp
      type: object
    FileURLResponseDto:
      properties:
        key:
          example: path/to/my-file.pdf
          type: string
        url:
          example: https://example.com/file.pdf
          type: string
      required:
        - url
        - key
      type: object
    FolderEntity:
      properties:
        children:
          items:
            $ref: "#/components/schemas/FolderEntity"
          type: array
        createdAt:
          description: The timestamp when the folder was created
          format: date-time
          type: string
        id:
          description: The unique identifier of the folder
          format: uuid
          type: string
        knowledge:
          $ref: "#/components/schemas/KnowledgeEntity"
        knowledgeId:
          description: The ID of the associated knowledge base
          format: uuid
          type: string
        name:
          description: The name of the folder
          type: string
        parent:
          $ref: "#/components/schemas/FolderEntity"
        parentId:
          description: The ID of the parent folder
          format: uuid
          nullable: true
          type: string
        root:
          description: Indicates if the folder is a root folder
          nullable: true
          type: boolean
        sources:
          items:
            $ref: "#/components/schemas/SourceEntity"
          type: array
        tenantId:
          description: The ID of the tenant this folder belongs to
          format: uuid
          type: string
        updatedAt:
          description: The timestamp when the folder was last updated
          format: date-time
          type: string
      required:
        - id
        - knowledgeId
        - name
        - tenantId
        - createdAt
        - updatedAt
      type: object
    ForgetPasswordDto:
      properties:
        email:
          type: string
      required:
        - email
      type: object
    GetOAuth2UrlResponseDto:
      properties:
        url:
          description: The url to redirect to
          example: https://google.com
          format: uri
          type: string
      required:
        - url
      type: object
    GetUploadUrlDto:
      properties:
        contentType:
          example: application/pdf
          type: string
        fileName:
          example: my-file.pdf
          type: string
        fileSize:
          description: "File size in bytes (max: 100.00 MB"
          example: 104857600
          type: number
      required:
        - fileName
        - contentType
        - fileSize
      type: object
    InviteEntity:
      properties:
        createdAt:
          description: The timestamp when the invite was created
          format: date-time
          type: string
        creator:
          $ref: "#/components/schemas/MemberEntity"
        creatorId:
          description: The ID of the user who created the invite
          format: uuid
          type: string
        email:
          description: The email address of the person being invited
          format: email
          type: string
        expiresAt:
          description: The timestamp when the invite expires
          format: date-time
          type: string
        id:
          description: The unique identifier of the invite
          format: uuid
          type: string
        role:
          $ref: "#/components/schemas/RoleEntity"
        roleId:
          description: The ID of the role assigned to the invited person
          format: uuid
          type: string
        tenant:
          $ref: "#/components/schemas/TenantEntity"
        tenantId:
          description: The ID of the tenant this invite belongs to
          format: uuid
          type: string
        updatedAt:
          description: The timestamp when the invite was last updated
          format: date-time
          type: string
        user:
          $ref: "#/components/schemas/UserEntity"
        userId:
          description: The ID of the user being invited, if they already exist
          format: uuid
          type: string
      required:
        - id
        - tenantId
        - email
        - roleId
        - creatorId
        - expiresAt
        - createdAt
        - updatedAt
      type: object
    KnowledgeEntity:
      properties:
        chats:
          items:
            $ref: "#/components/schemas/ChatEntity"
          type: array
        createdAt:
          description: The timestamp when the knowledge base was created
          format: date-time
          type: string
        deleteError:
          description: The error message if deletion fails
          nullable: true
          type: string
        description:
          description: A brief description of the knowledge base
          nullable: true
          type: string
        files:
          description: The number of files in the knowledge base
          type: number
        folders:
          items:
            $ref: "#/components/schemas/FolderEntity"
          type: array
        id:
          description: The unique identifier of the knowledge base
          format: uuid
          type: string
        knowledgeLLMs:
          items:
            $ref: "#/components/schemas/KnowledgeLLMEntity"
          type: array
        messages:
          items:
            $ref: "#/components/schemas/MessageEntity"
          type: array
        slug:
          description: The URL-friendly slug for the knowledge base
          type: string
        sources:
          items:
            $ref: "#/components/schemas/SourceEntity"
          type: array
        status:
          description: The status of the knowledge base
          enum:
            - DELETING
            - DELETE_ERROR
            - OK
          type: string
        storage:
          description: The total storage used by the knowledge base in bytes
          type: string
        tenantId:
          description: The ID of the tenant this knowledge base belongs to
          format: uuid
          type: string
        title:
          description: The title of the knowledge base
          type: string
        updatedAt:
          description: The timestamp when the knowledge base was last updated
          format: date-time
          type: string
      required:
        - id
        - slug
        - title
        - status
        - files
        - storage
        - tenantId
        - createdAt
        - updatedAt
      type: object
    KnowledgeLLMEntity:
      properties:
        createdAt:
          description: The timestamp when the link was created
          format: date-time
          type: string
        default:
          default: false
          description: Indicates if this is the default LLM for the knowledge base
          type: boolean
        id:
          description: The unique identifier of the knowledge-llm link
          format: uuid
          type: string
        knowledge:
          $ref: "#/components/schemas/KnowledgeEntity"
        knowledgeId:
          description: The ID of the associated knowledge base
          format: uuid
          type: string
        llm:
          $ref: "#/components/schemas/LLMEntity"
        llmId:
          description: The ID of the associated LLM
          format: uuid
          type: string
        updatedAt:
          description: The timestamp when the link was last updated
          format: date-time
          type: string
      required:
        - id
        - default
        - knowledgeId
        - llmId
        - createdAt
        - updatedAt
      type: object
    LLMEntity:
      properties:
        config:
          description: The configuration for the LLM
          type: object
        createdAt:
          description: The timestamp when the LLM was created
          format: date-time
          type: string
        creatorId:
          description: The ID of the user who created the LLM
          format: uuid
          nullable: true
          type: string
        default:
          default: false
          description: Indicates if this is the default LLM for its type
          type: boolean
        id:
          description: The unique identifier of the LLM
          format: uuid
          type: string
        knowledgeLLMs:
          items:
            $ref: "#/components/schemas/KnowledgeLLMEntity"
          type: array
        model:
          description: The model identifier
          type: string
        name:
          description: The name of the LLM
          type: string
        tenantId:
          description: The ID of the tenant this LLM belongs to
          format: uuid
          type: string
        type:
          description: The type of the LLM
          enum:
            - EMBEDDING
            - TEXT
          type: string
        updatedAt:
          description: The timestamp when the LLM was last updated
          format: date-time
          type: string
      required:
        - id
        - default
        - name
        - model
        - config
        - type
        - tenantId
        - createdAt
        - updatedAt
      type: object
    LLMPreset:
      properties:
        adapter:
          description: Name of the adapter responsible for executing the LLM.
          example: openai
          type: string
        config:
          additionalProperties: true
          description: Adapter configuration.
          example:
            baseUrl: https://api.openai.com/v1
            timeout: 30000
            type: TEXT
          type: object
        defaults:
          additionalProperties:
            type: string
          example:
            model: gpt-4
            temperature: 0.7
          type: object
        description:
          description: A description of the LLM preset.
          example: A state-of-the-art LLM for general reasoning.
          type: string
        fields:
          additionalProperties:
            enum:
              - string
              - secret-string
            type: string
          example:
            apiKey: secret-string
            model: string
          type: object
        iconPath:
          description: The URL or path of the icon representing the LLM.
          type: string
        name:
          description: The unique identifier of the LLM preset.
          type: string
        required:
          description: List of required field names.
          example:
            - apiKey
            - model
          items:
            type: string
          type: array
      required:
        - name
        - description
        - iconPath
        - adapter
      type: object
    LoginDto:
      properties:
        email:
          description: The email of the user
          example: my@example.com
          format: email
          type: string
        password:
          description: The password of the user
          format: password
          type: string
        redirect:
          description: The path to redirect
          example: /
          type: string
      required:
        - email
        - password
      type: object
    LoginResponseDto:
      properties:
        redirect:
          description: The path to redirect
          example: /
          type: string
      required:
        - redirect
      type: object
    MemberEntity:
      properties:
        createdAt:
          description: The timestamp when the member was created
          format: date-time
          type: string
        id:
          description: The unique identifier of the member
          format: uuid
          type: string
        invites:
          items:
            $ref: "#/components/schemas/InviteEntity"
          type: array
        notifications:
          items:
            $ref: "#/components/schemas/NotificationEntity"
          type: array
        owner:
          default: false
          description: Indicates if the member is the owner of the tenant
          type: boolean
        role:
          $ref: "#/components/schemas/RoleEntity"
        roleId:
          description: The ID of the role assigned to the member
          format: uuid
          type: string
        tenant:
          $ref: "#/components/schemas/TenantEntity"
        tenantId:
          description: The ID of the tenant
          format: uuid
          type: string
        updatedAt:
          description: The timestamp when the member was last updated
          format: date-time
          type: string
        user:
          $ref: "#/components/schemas/UserEntity"
        userId:
          description: The ID of the user
          format: uuid
          type: string
      required:
        - id
        - owner
        - userId
        - tenantId
        - roleId
        - createdAt
        - updatedAt
      type: object
    MessageEntity:
      properties:
        chat:
          $ref: "#/components/schemas/ChatEntity"
        chatId:
          description: The ID of the chat this message belongs to
          format: uuid
          type: string
        content:
          description: The content of the message
          type: string
        createdAt:
          description: The timestamp when the message was created
          format: date-time
          type: string
        id:
          description: The unique identifier of the message
          format: uuid
          type: string
        knowledge:
          $ref: "#/components/schemas/KnowledgeEntity"
        knowledgeId:
          description: The ID of the knowledge base associated with this message
          format: uuid
          type: string
        messageRole:
          description: The role of the message sender
          enum:
            - user
            - assistant
            - system
          type: string
        tenantId:
          description: The ID of the tenant this message belongs to
          format: uuid
          type: string
        updatedAt:
          description: The timestamp when the message was last updated
          format: date-time
          type: string
      required:
        - id
        - messageRole
        - content
        - chatId
        - knowledgeId
        - tenantId
        - createdAt
        - updatedAt
      type: object
    NotificationEntity:
      properties:
        createdAt:
          description: The timestamp when the notification was created
          format: date-time
          type: string
        createdBy:
          $ref: "#/components/schemas/MemberEntity"
        createdById:
          description: The ID of the user who created the notification
          format: uuid
          type: string
        description:
          description: The description of the notification
          type: string
        destination:
          $ref: "#/components/schemas/MemberEntity"
        destinationId:
          description: The ID of the user who should receive the notification
          format: uuid
          type: string
        id:
          description: The unique identifier of the notification
          format: uuid
          type: string
        link:
          description: A link associated with the notification
          type: string
        read:
          default: false
          description: Indicates if the notification has been read
          type: boolean
        readAt:
          description: The timestamp when the notification was read
          format: date-time
          type: string
        tenant:
          $ref: "#/components/schemas/TenantEntity"
        tenantId:
          description: The ID of the tenant this notification belongs to
          format: uuid
          type: string
        title:
          description: The title of the notification
          type: string
      required:
        - id
        - title
        - description
        - read
        - tenantId
        - destinationId
        - createdAt
        - tenant
      type: object
    RecentSearch:
      properties:
        count:
          description: The count of the recent search
          type: number
        lastUsed:
          description: The last used date of the recent search
          format: date-time
          type: string
        text:
          description: The text of the recent search
          type: string
      required:
        - text
        - count
        - lastUsed
      type: object
    RoleEntity:
      properties:
        createdAt:
          description: The timestamp when the role was created
          format: date-time
          type: string
        createdBy:
          $ref: "#/components/schemas/MemberEntity"
        createdById:
          description: The ID of the user who created the role
          format: uuid
          nullable: true
          type: string
        id:
          description: The unique identifier of the role
          format: uuid
          type: string
        invites:
          items:
            $ref: "#/components/schemas/InviteEntity"
          type: array
        key:
          description: The key of the role
          type: string
        members:
          items:
            $ref: "#/components/schemas/MemberEntity"
          type: array
        name:
          description: The name of the role
          type: string
        permissions:
          description: The permissions of the role as a bitmask
          type: number
        scope:
          description: The scope of the role
          enum:
            - TENANT
            - GLOBAL
          type: string
        tenant:
          $ref: "#/components/schemas/TenantEntity"
        tenantId:
          description: The ID of the tenant this role belongs to
          format: uuid
          nullable: true
          type: string
        updatedAt:
          description: The timestamp when the role was last updated
          format: date-time
          type: string
        users:
          items:
            $ref: "#/components/schemas/UserEntity"
          type: array
      required:
        - id
        - key
        - name
        - permissions
        - scope
        - tenantId
        - createdById
        - createdAt
        - updatedAt
      type: object
    SendInviteDto:
      properties:
        emails:
          items:
            $ref: "#/components/schemas/SendInviteItemDto"
          type: array
      required:
        - emails
      type: object
    SendInviteItemDto:
      properties:
        email:
          type: string
        roleId:
          type: string
      required:
        - email
        - roleId
      type: object
    SendInviteResponseDto:
      properties:
        alreadyInTenant:
          items:
            $ref: "#/components/schemas/MemberEntity"
          type: array
        reSendedInvites:
          items:
            $ref: "#/components/schemas/InviteEntity"
          type: array
        sendedInvites:
          items:
            $ref: "#/components/schemas/InviteEntity"
          type: array
      required:
        - sendedInvites
        - reSendedInvites
        - alreadyInTenant
      type: object
    SourceAudioMetadata:
      properties:
        contentType:
          type: string
        duration:
          type: number
        exif:
          type: object
        extension:
          type: string
        lastModified:
          type: number
        size:
          type: number
        type:
          enum:
            - TEXT
            - DOC
            - LINK
            - VIDEO
            - AUDIO
            - IMAGE
          type: string
      required:
        - extension
        - contentType
        - size
        - type
      type: object
    SourceDocMetadata:
      properties:
        contentType:
          type: string
        exif:
          type: object
        extension:
          type: string
        lastModified:
          type: number
        size:
          type: number
        type:
          enum:
            - TEXT
            - DOC
            - LINK
            - VIDEO
            - AUDIO
            - IMAGE
          type: string
      required:
        - extension
        - contentType
        - size
        - type
      type: object
    SourceEntity:
      properties:
        createdAt:
          description: The timestamp when the source was created
          format: date-time
          type: string
        description:
          description: A brief description of the source
          type: string
        folder:
          $ref: "#/components/schemas/FolderEntity"
        folderId:
          description: The ID of the folder this source belongs to
          format: uuid
          type: string
        id:
          description: The unique identifier of the source
          format: uuid
          type: string
        indexError:
          description: The error message if indexing fails
          type: string
        indexStatus:
          description: The indexing status of the source
          enum:
            - PENDING
            - INDEXING
            - INDEXED
            - ERROR
          type: string
        key:
          description: The key of the source file in the storage
          type: string
        knowledge:
          $ref: "#/components/schemas/KnowledgeEntity"
        knowledgeId:
          description: The ID of the knowledge base this source belongs to
          format: uuid
          type: string
        memoryId:
          description: The ID of the memory associated with this source
          format: uuid
          type: string
        metadata:
          description: The metadata of the source
          oneOf:
            - $ref: "#/components/schemas/SourceDocMetadata"
            - $ref: "#/components/schemas/SourceImageMetadata"
            - $ref: "#/components/schemas/SourceVideoMetadata"
            - $ref: "#/components/schemas/SourceAudioMetadata"
        name:
          description: The name of the source
          type: string
        originalName:
          description: The original name of the file
          type: string
        path:
          description: The path of the source file
          type: string
        sourceType:
          description: The type of the source
          enum:
            - TEXT
            - DOC
            - LINK
            - VIDEO
            - AUDIO
            - IMAGE
          type: string
        tenant:
          $ref: "#/components/schemas/TenantEntity"
        tenantId:
          description: The ID of the tenant this source belongs to
          format: uuid
          type: string
        updatedAt:
          description: The timestamp when the source was last updated
          format: date-time
          type: string
      required:
        - id
        - key
        - path
        - name
        - metadata
        - sourceType
        - indexStatus
        - knowledgeId
        - tenantId
        - createdAt
        - updatedAt
      type: object
    SourceFragment:
      properties:
        content:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        knowledgeId:
          format: uuid
          type: string
        metadata:
          oneOf:
            - $ref: "#/components/schemas/SourceDocMetadata"
            - $ref: "#/components/schemas/SourceImageMetadata"
            - $ref: "#/components/schemas/SourceVideoMetadata"
            - $ref: "#/components/schemas/SourceAudioMetadata"
        seqId:
          type: number
        sourceId:
          format: uuid
